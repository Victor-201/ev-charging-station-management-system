_format_version: "3.0"
services:
- connect_timeout: 60000
  enabled: true
  host: ev_station_service
  name: ev_station_service
  port: 3000
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: station_chargers_route
    path_handling: v0
    paths:
    - /api/v1/chargers
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
  - https_redirect_status_code: 426
    name: station_route
    path_handling: v0
    paths:
    - /api/v1/stations
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
  write_timeout: 60000
